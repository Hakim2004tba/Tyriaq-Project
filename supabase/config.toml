# Tyriaq — Supabase local config.
# Used by `supabase start` / `supabase db reset`; the hosted project is
# configured through its dashboard.

project_id = "tyriaq"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Off locally so signup returns a session immediately and you can test the
# whole flow without an inbox. Turn this ON for anything public — without
# it, anyone can register an address they do not control.
enable_confirmations = false

[inbucket]
enabled = true
port = 54324
