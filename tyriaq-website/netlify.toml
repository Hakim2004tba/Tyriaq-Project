# نادي ترياق — إعدادات Netlify
# ينشر public/ فقط؛ data/ و server.mjs و lib/ تبقى خارج ما يُنشر للعلن.

[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo 'no build step'"

[functions]
  node_bundler = "esbuild"
  # lib/ يعيش خارج مجلد الدوال، فنطلب تضمينه صراحةً
  included_files = ["lib/**"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
